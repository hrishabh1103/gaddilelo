version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: gaadilelo_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: gaadilelo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../database/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ../database/seed/seed_indore.sql:/docker-entrypoint-initdb.d/02_seed.sql

  backend:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.backend
    container_name: gaadilelo_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@db:5432/gaadilelo
      - SECRET_KEY=gaadilelo-super-secret-production-grade-key-2026-indore
      - DEFAULT_PILOT_CITY=Indore
      - CORS_ORIGINS=http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      - db

  frontend:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.frontend
    container_name: gaadilelo_frontend
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
      - NEXT_PUBLIC_BRAND_NAME=GaadiLelo
      - NEXT_PUBLIC_PILOT_CITY=Indore
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:

