services:
  - type: web
    name: gaadilelo-backend
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install --upgrade pip && pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: DB_SSL_CA_CERT
        sync: false
      - key: FRONTEND_URL
        value: https://gaddilelo.hrishabhbase.workers.dev
      - key: CORS_ORIGINS
        value: "https://gaddilelo.hrishabhbase.workers.dev,https://gaadilelo.com,https://www.gaadilelo.com,http://localhost:3000"
      - key: EMAIL_PROVIDER
        value: smtp
      - key: SMTP_HOST
        value: smtp.resend.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        value: resend
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        value: onboarding@resend.dev
      - key: SMTP_USE_TLS
        value: "true"
      - key: ENABLE_BACKGROUND_SCHEDULER
        value: "false"

